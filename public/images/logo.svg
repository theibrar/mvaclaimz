<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <!-- Minimalist Legal Shield Mark -->
  <g transform="translate(6, 6)">
    <!-- Sleek Rounded Shield -->
    <path d="M19 4 L33 9.5 C33 24 25.5 32 19 35 C12.5 32 5 24 5 9.5 Z" fill="#0C1E36" />
    <path d="M19 6.5 L31 11.2 C31 23 24.5 29.8 19 32.5 C13.5 29.8 7 23 7 11.2 Z" stroke="#C7FD0D" stroke-width="1.5" fill="none" opacity="0.6" />
    <!-- Dynamic Checkmark -->
    <path d="M13.5 18 L17.5 22 L24.5 14" stroke="#C7FD0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Clean, Lite, Modern Single-Line -->
  <text x="56" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#0C1E36" letter-spacing="-0.3">
    MVA
  </text>
  <text x="110" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#0C1E36" letter-spacing="0.5">
    CLAIMZ
  </text>
  <!-- Accent Period Dot in Electric Lime -->
  <circle cx="198" cy="30.5" r="3.5" fill="#C7FD0D" stroke="#0C1E36" stroke-width="1" />
</svg>
